security:
    password_hashers:
        App\Entity\User:
            # bcrypt est le standard actuel recommandé par Symfony Security 7.x.
            # Note : l'ancien fichier utilisait argon2id — changé selon le CDC V3 (§2 changements mars 2026).
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ─── Hiérarchie des rôles ─────────────────────────────────────────────────
    #
    # Symfony applique cette hiérarchie automatiquement via le RoleHierarchyVoter.
    # Si un utilisateur a ROLE_ADMIN, Symfony lui accordera aussi ROLE_STRUCTURE,
    # ROLE_MODERATOR, ROLE_ARTIST et ROLE_USER — sans qu'on ait à les inscrire
    # manuellement dans la BDD.
    #
    # Convention du projet (CDC V3 §7) :
    #   ROLE_USER      → tout compte authentifié
    #   ROLE_ARTIST    → profil artiste activé
    #   ROLE_STRUCTURE → compte structure partenaire validé par un admin
    #   ROLE_MODERATOR → modérateur de la communauté (forum, signalements)
    #   ROLE_ADMIN     → équipe Bazaart (accès complet)
    role_hierarchy:
        ROLE_ARTIST:    [ROLE_USER]
        ROLE_STRUCTURE: [ROLE_USER]
        ROLE_MODERATOR: [ROLE_USER]
        # ROLE_ADMIN hérite de TOUS les autres rôles — l'équipe Bazaart a accès à tout
        ROLE_ADMIN:     [ROLE_USER, ROLE_ARTIST, ROLE_STRUCTURE, ROLE_MODERATOR]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            # UserChecker vérifie l'état du compte (ex: anonymisé RGPD) avant toute
            # authentification — que ce soit via formulaire login ou Google OAuth.
            # Sans ce checker, Google OAuth pourrait recréer un compte anonymisé.
            user_checker: App\Security\UserChecker
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                # success_handler : notre handler personnalisé prend le relais APRÈS une
                # authentification réussie. Il implémente la logique de redirection :
                #   1. Target path mémorisé avant /login (comportement standard Symfony)
                #   2. Données matching en session → home #swipe-section
                #   3. Admin → app_admin_dashboard
                #   4. Défaut → app_dashboard
                # NB : quand success_handler est défini, default_target_path est ignoré
                # par Symfony. On le conserve en commentaire comme documentation de fallback.
                success_handler: App\Security\LoginSuccessHandler
                # default_target_path: app_dashboard  # ignoré si success_handler est défini
                username_parameter: email
                password_parameter: password
                # ── Protection CSRF sur le formulaire de connexion (audit sécurité) ──
                # Sans ça, un site tiers malveillant pouvait forcer le navigateur d'une
                # victime à soumettre un POST vers /login (ex: pour verrouiller un compte
                # via des tentatives échouées, ou dans certains scénarios de fixation de
                # session). Le champ caché `_csrf_token` correspondant est ajouté dans
                # auth/login.html.twig via `csrf_token('authenticate')` — le token_id doit
                # être identique des deux côtés.
                # NB : depuis l'activation du CSRF stateless (voir config/packages/csrf.yaml,
                # `stateless_token_ids: [submit, authenticate, logout]`), `csrf_token('authenticate')`
                # ne génère PLUS un token lié à la session serveur. La protection repose sur
                # un cookie signé (HMAC avec APP_SECRET) : le token est vérifié cryptographiquement
                # sans état stocké côté serveur, ce qui fonctionne même sans session active
                # (utile par ex. juste après un logout, ou pour des clients sans cookie de session).
                enable_csrf: true
                csrf_parameter: '_csrf_token'
                csrf_token_id: 'authenticate'
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 7 jours
            # Déclare notre GoogleAuthenticator pour gérer le callback OAuth2
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            # Avec plusieurs authenticators, Symfony doit savoir lequel gère
            # la redirection des utilisateurs non connectés vers la page de login
            entry_point: App\Security\GoogleAuthenticator
            # ── Throttling du login (RGPD / Sécurité CDC V3 §9) ──────────────
            #
            # login_throttling : Symfony Security gère le rate limiting nativement
            # à partir de max_attempts + interval — aucun service RateLimiterFactory
            # custom n'est nécessaire ici (il n'y a pas de "login_limiter" dans
            # framework.yaml, c'est intentionnel).
            #
            # Symfony se charge automatiquement de bloquer l'authentification si la
            # limite est dépassée et retourne TooManyLoginAttemptsAuthenticationException.
            # Cela couvre TOUTES les méthodes du firewall (form_login + Google OAuth).
            #
            # Pour /register, le throttling est géré manuellement dans
            # AuthController::register() via RateLimiterFactory $registerLimiter.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        # Les routes Google OAuth doivent être publiques (l'utilisateur n'est pas encore connecté)
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        # ── Réinitialisation du mot de passe — PUBLIQUES ──────────────────────
        # Ces routes doivent être accessibles sans être connecté (c'est l'objet même
        # du parcours "mot de passe oublié" : l'utilisateur ne peut PAS se connecter).
        # Placées AVANT la règle catch-all ^/ pour ne pas être interceptées.
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }
        - { path: ^/reinitialiser-mot-de-passe, roles: PUBLIC_ACCESS }
        # ── Vérification d'email — PUBLIQUE ──────────────────────────────────
        # Ces routes doivent être accessibles sans être connecté :
        #   - /verifier-email/confirmation : page "vérifie ta boîte mail" après inscription
        #   - /verifier-email              : route cliquée depuis l'email (lien signé)
        #   - /verifier-email/renvoyer     : renvoi de l'email de confirmation
        # Sans PUBLIC_ACCESS, l'utilisateur serait redirigé vers /login alors
        # qu'il essaie précisément de confirmer son email pour SE connecter.
        - { path: ^/verifier-email, roles: PUBLIC_ACCESS }
        # Page d'accueil et formulaire de contact — accessibles sans être connecté
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/contact, roles: PUBLIC_ACCESS }
        # ── Pages légales RGPD — PUBLIQUES (obligation légale) ────────────────
        # Ces pages doivent être consultables AVANT la création d'un compte
        # (politique de confidentialité, CGU, mentions légales).
        # LCEN art. 6-III oblige les mentions légales à être accessibles sans restriction.
        - { path: ^/confidentialite, roles: PUBLIC_ACCESS }
        - { path: ^/cgu, roles: PUBLIC_ACCESS }
        - { path: ^/cgv, roles: PUBLIC_ACCESS }
        - { path: ^/mentions-legales, roles: PUBLIC_ACCESS }
        # Espace structure : réservé aux comptes structure activés (ROLE_STRUCTURE)
        # Note : la vérification isStructurePartner = true est faite dans StructureVoter,
        # car access_control ne peut pas lire les champs BDD.
        - { path: ^/structure/dashboard, roles: ROLE_STRUCTURE }
        - { path: ^/structure/register, roles: ROLE_USER }
        # Administration : ROLE_ADMIN seulement
        - { path: ^/admin, roles: ROLE_ADMIN }
        # ── Blog — PUBLIC pour l'indexation SEO ──────────────────────────────
        # /articles (liste) et /articles/{slug} (fiche) sont accessibles sans
        # connexion afin que Google puisse les indexer.
        # La sécurité des routes de gestion (new, edit, delete, my) est portée
        # par #[IsGranted('ROLE_ADMIN')] au niveau méthode dans ArticleController
        # → défense en profondeur, indépendante de cette règle firewall.
        - { path: ^/articles, roles: PUBLIC_ACCESS }
        # ── Page tarifs — PUBLIQUE ────────────────────────────────────────────
        # Accessible sans connexion : vitrine commerciale des abonnements et formations.
        # Les boutons "S'abonner" redirigent vers login si l'utilisateur n'est pas connecté.
        # Le webhook Stripe (/stripe/webhook) est PUBLIC_ACCESS par nature (appel serveur Stripe).
        - { path: ^/tarifs, roles: PUBLIC_ACCESS }
        - { path: ^/stripe/webhook, roles: PUBLIC_ACCESS }
        # ── Formations — catalogue PUBLIC, espace apprenant PROTÉGÉ ────────────
        # ORDRE IMPORTANT : access_control évalue de haut en bas, la PREMIÈRE règle
        # qui matche gagne. On place donc les sous-routes sensibles AVANT la règle
        # publique générale ^/formations, sinon elles deviendraient publiques.
        #
        # Sous-routes authentifiées (défense en profondeur : ces routes ont DÉJÀ un
        # #[IsGranted] au niveau contrôleur, on double la protection au firewall) :
        #   - /formations/{slug}/learn[...]  → parcours apprenant (leçons, progression)
        #   - /formations/{slug}/enroll      → inscription à une formation
        #   - /formations/{slug}/payer       → paiement Stripe d'une formation payante
        #   - /formations/paiement-succes|annule → callbacks de paiement
        #
        # learn + enroll : IS_AUTHENTICATED_FULLY pour S'ALIGNER sur le contrôleur
        # (#[IsGranted('IS_AUTHENTICATED_FULLY')]). Ainsi un visiteur non connecté est
        # REDIRIGÉ vers /login par le firewall (bonne UX) au lieu de recevoir un 403
        # côté contrôleur. IS_AUTHENTICATED_FULLY exclut l'auth via cookie remember-me.
        - { path: '^/formations/[^/]+/learn', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/formations/[^/]+/enroll', roles: IS_AUTHENTICATED_FULLY }
        # payer + paiement : ROLE_USER, cohérent avec leur #[IsGranted('ROLE_USER')]
        - { path: '^/formations/[^/]+/payer', roles: ROLE_USER }
        - { path: ^/formations/paiement, roles: ROLE_USER }
        # Catalogue (/formations) et page de vente (/formations/{slug}) : PUBLICS.
        # Objectif : un visiteur non connecté peut parcourir l'offre de formations
        # (donner envie + indexation SEO) avant de créer un compte.
        - { path: ^/formations, roles: PUBLIC_ACCESS }
        # Tout le reste : authentification requise
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                # En environnement de test, on réduit le coût du hashage pour accélérer les tests.
                # `cost: 4` est le minimum pour bcrypt (par défaut: 13) — acceptable en test uniquement.
                # time_cost et memory_cost sont supprimés : ce sont des paramètres Argon2id,
                # sans effet avec l'algorithme `auto` (qui sélectionne bcrypt en V1).
                algorithm: auto
                cost: 4
